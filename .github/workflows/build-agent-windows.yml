name: Build Windows Agent

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: build-agent-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-agent:
    name: Package PrintGo-Agent.exe
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack & pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@12.6.0 --activate

      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Run Windows Agent unit & native DPAPI tests
        shell: bash
        run: pnpm test apps/agent/windows

      - name: Build Agent & compile native PrintGo-Agent.exe
        shell: bash
        run: |
          node scripts/build-agent-windows.mjs

      - name: Smoke-test PrintGo-Agent.exe
        shell: pwsh
        run: |
          $exe = "dist-package/PrintGo-Windows-Test/PrintGo-Agent.exe"
          Write-Host "Verifying binary exists at $exe..."
          if (-not (Test-Path $exe)) { throw "Binary not found at $exe" }
          Write-Host "Testing --version flag..."
          & $exe --version
          Write-Host "Testing --help flag..."
          & $exe --help
          Write-Host "Smoke test passed successfully!"

      - name: Bundle portable SumatraPDF.exe into distribution package
        shell: pwsh
        run: |
          $dir = "dist-package/PrintGo-Windows-Test"
          $sumatraZip = "sumatra-portable.zip"
          Write-Host "Downloading portable SumatraPDF for deterministic printing..."
          Invoke-WebRequest -Uri "https://files.sumatrapdfreader.org/software/sumatrapdf/rel/3.6.1/SumatraPDF-3.6.1-64.zip" -OutFile $sumatraZip
          Expand-Archive -Path $sumatraZip -DestinationPath "sumatra-temp" -Force
          $sumatraExe = Get-ChildItem "sumatra-temp" -Filter "SumatraPDF*.exe" | Select-Object -First 1
          if (-not $sumatraExe) { throw "Could not find SumatraPDF executable in downloaded archive" }
          Copy-Item $sumatraExe.FullName -Destination "$dir/SumatraPDF.exe" -Force
          Write-Host "Successfully bundled SumatraPDF.exe into $dir"
          Remove-Item -Recurse -Force "sumatra-temp", $sumatraZip

      - name: Build PrintGo Command Center GUI
        shell: pwsh
        run: |
          $dir = "dist-package/PrintGo-Windows-Test"
          $csc = "$env:SystemRoot\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (Test-Path $csc) {
            Write-Host "Compiling PrintGo Command Center via $csc..."
            & $csc /nologo /target:winexe /out:"$dir/PrintGo-Command-Center.exe" /r:System.Windows.Forms.dll,System.Drawing.dll,System.Management.dll apps/agent/windows/control-center/PrintGoControlCenter.cs
            Write-Host "Successfully compiled PrintGo-Command-Center.exe"
          } else {
            Write-Host "Checking PATH for csc..."
            & csc /nologo /target:winexe /out:"$dir/PrintGo-Command-Center.exe" /r:System.Windows.Forms.dll,System.Drawing.dll,System.Management.dll apps/agent/windows/control-center/PrintGoControlCenter.cs
          }

      - name: Calculate SHA-256 and package distribution ZIP
        shell: pwsh
        run: |
          $dir = "dist-package/PrintGo-Windows-Test"
          $sums = @()
          Get-ChildItem -Path $dir -Filter "*.exe" | ForEach-Object {
            $h = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower()
            Write-Host "$($_.Name) SHA-256: $h"
            $sums += "$h  $($_.Name)"
          }
          Set-Content -Path "$dir/SHA256SUMS.txt" -Value ($sums -join "`n")
          Compress-Archive -Path "$dir/*" -DestinationPath "dist-package/PrintGo-Windows-Test.zip" -Force
          Write-Host "Created dist-package/PrintGo-Windows-Test.zip"

      - name: Upload Windows Agent Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrintGo-Windows-Test
          path: dist-package/PrintGo-Windows-Test
          retention-days: 14

      - name: Upload Windows Agent ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrintGo-Windows-Test-ZIP
          path: dist-package/PrintGo-Windows-Test.zip
          retention-days: 14

      - name: Publish or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            TAG="v2.1.0-phase9"
          fi
          echo "Target Release Tag: $TAG"
          gh release view "$TAG" || gh release create "$TAG" --title "PrintGo Release $TAG" --notes "Release package for PrintGo Windows Print Agent and Command Center."
          gh release upload "$TAG" dist-package/PrintGo-Windows-Test/*.exe dist-package/PrintGo-Windows-Test.zip dist-package/PrintGo-Windows-Test/SHA256SUMS.txt --clobber

