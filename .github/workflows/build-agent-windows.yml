name: Build Windows Agent

on:
  push:
    branches:
      - main
    paths:
      - "apps/agent/windows/**"
      - "packages/**"
      - "scripts/build-agent-windows.mjs"
      - "scripts/windows-agent-test/**"
      - ".github/workflows/build-agent-windows.yml"
  workflow_dispatch:

concurrency:
  group: build-agent-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-agent:
    name: Package PrintGo-Agent.exe
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack & pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@12.6.0 --activate

      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Run Windows Agent unit & native DPAPI tests
        shell: bash
        run: pnpm test apps/agent/windows

      - name: Build Agent & compile native PrintGo-Agent.exe
        shell: bash
        run: |
          node scripts/build-agent-windows.mjs

      - name: Smoke-test PrintGo-Agent.exe
        shell: pwsh
        run: |
          $exe = "dist-package/PrintGo-Windows-Test/PrintGo-Agent.exe"
          Write-Host "Verifying binary exists at $exe..."
          if (-not (Test-Path $exe)) { throw "Binary not found at $exe" }
          Write-Host "Testing --version flag..."
          & $exe --version
          Write-Host "Testing --help flag..."
          & $exe --help
          Write-Host "Smoke test passed successfully!"

      - name: Calculate SHA-256 and package distribution ZIP
        shell: pwsh
        run: |
          $dir = "dist-package/PrintGo-Windows-Test"
          $exe = "$dir/PrintGo-Agent.exe"
          $hash = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLower()
          Write-Host "PrintGo-Agent.exe SHA-256: $hash"
          Set-Content -Path "$dir/SHA256SUMS.txt" -Value "$hash  PrintGo-Agent.exe"
          Compress-Archive -Path "$dir/*" -DestinationPath "dist-package/PrintGo-Windows-Test.zip" -Force
          Write-Host "Created dist-package/PrintGo-Windows-Test.zip"

      - name: Upload Windows Agent Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrintGo-Windows-Test
          path: dist-package/PrintGo-Windows-Test
          retention-days: 14

      - name: Upload Windows Agent ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrintGo-Windows-Test-ZIP
          path: dist-package/PrintGo-Windows-Test.zip
          retention-days: 14

      - name: Publish or Update GitHub Release v2.0.0
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view v2.0.0 || gh release create v2.0.0 --title "PrintGo Windows Agent v2.0.0" --notes "Official release package for PrintGo Windows Print Agent."
          gh release upload v2.0.0 dist-package/PrintGo-Windows-Test/PrintGo-Agent.exe dist-package/PrintGo-Windows-Test.zip --clobber
