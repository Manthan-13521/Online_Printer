name: Build Windows Agent

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: build-agent-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-agent:
    name: Package PrintGo-Agent.exe
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack & pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@12.6.0 --activate

      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Run Windows Agent unit & native DPAPI tests
        shell: bash
        run: pnpm test apps/agent/windows

      - name: Build Agent & compile native PrintGo-Agent.exe
        shell: bash
        run: |
          node scripts/build-agent-windows.mjs

      - name: Smoke-test PrintGo-Agent.exe
        shell: pwsh
        run: |
          $exe = "dist-package/PrintGo-Windows-Test/PrintGo-Agent.exe"
          Write-Host "Verifying binary exists at $exe..."
          if (-not (Test-Path $exe)) { throw "Binary not found at $exe" }
          Write-Host "Testing --version flag..."
          & $exe --version
          Write-Host "Testing --help flag..."
          & $exe --help
          Write-Host "Smoke test passed successfully!"

      - name: Download & verify portable SumatraPDF.exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "installer/stage", "installer/dist", "release-artifacts"
          $sumatraZip = "sumatra-portable.zip"
          Write-Host "Downloading portable SumatraPDF 3.6.1-64..."
          Invoke-WebRequest -Uri "https://files.sumatrapdfreader.org/software/sumatrapdf/rel/3.6.1/SumatraPDF-3.6.1-64.zip" -OutFile $sumatraZip
          Expand-Archive -Path $sumatraZip -DestinationPath "sumatra-temp" -Force
          $sumatraExe = Get-ChildItem "sumatra-temp" -Filter "SumatraPDF*.exe" | Select-Object -First 1
          if (-not $sumatraExe) { throw "Could not find SumatraPDF executable in downloaded archive" }
          Copy-Item $sumatraExe.FullName -Destination "installer/stage/SumatraPDF.exe" -Force
          Remove-Item -Recurse -Force "sumatra-temp", $sumatraZip
          Write-Host "SumatraPDF staged successfully."

      - name: Compile PrintGo Command Center GUI
        shell: pwsh
        run: |
          $sourcePath = (Resolve-Path "apps/agent/windows/control-center/PrintGoControlCenter.cs").Path
          $csc = "$env:SystemRoot\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          $outExe = (Resolve-Path "installer/stage").Path + "\PrintGo-ControlCenter.exe"
          Write-Host "Compiling PrintGo Command Center via $csc to $outExe..."
          & $csc /nologo /target:winexe /optimize+ /out:"$outExe" /r:System.Windows.Forms.dll,System.Drawing.dll,System.Management.dll,System.Web.Extensions.dll,Microsoft.VisualBasic.dll "$sourcePath"
          if (-not (Test-Path "$outExe")) { throw "PrintGo-ControlCenter.exe compilation failed" }
          Write-Host "PrintGo-ControlCenter.exe compiled successfully: $((Get-Item $outExe).Length) bytes"

      - name: Stage Agent and Notices
        shell: pwsh
        run: |
          $agentExe = "apps/agent/windows/dist/PrintGo-Agent.exe"
          if (-not (Test-Path $agentExe)) { throw "PrintGo-Agent.exe not found at $agentExe" }
          Copy-Item $agentExe -Destination "installer/stage/PrintGo-Agent.exe" -Force
          Copy-Item "THIRD_PARTY_NOTICES.txt" -Destination "installer/stage/THIRD_PARTY_NOTICES.txt" -Force
          Write-Host "Stage directory prepared with:"
          Get-ChildItem "installer/stage" | Format-Table Name, Length

      - name: Build Inno Setup Installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Host "Installing Inno Setup via choco..."
            choco install innosetup --no-progress -y
          }
          Write-Host "Compiling installer/PrintGo.iss with Inno Setup..."
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" (Resolve-Path "installer/PrintGo.iss").Path
          $setupExe = "installer/dist/PrintGo-Setup.exe"
          if (-not (Test-Path $setupExe)) { throw "PrintGo-Setup.exe was not created" }
          Write-Host "Installer compiled successfully: $((Get-Item $setupExe).Length) bytes"

      - name: Assemble Release Packages
        shell: pwsh
        run: |
          $relDir = "release-artifacts"
          New-Item -ItemType Directory -Force -Path $relDir

          # 1. Standalone Agent exe
          Copy-Item "installer/stage/PrintGo-Agent.exe" -Destination "$relDir/PrintGo-Agent-Windows-x64.exe" -Force

          # 2. Inno Setup Installer exe
          Copy-Item "installer/dist/PrintGo-Setup.exe" -Destination "$relDir/PrintGo-Command-Center-Windows-x64-Setup.exe" -Force

          # 3. Command Center Portable ZIP (contains GUI + Agent + SumatraPDF + Notices)
          Compress-Archive -Path "installer/stage/*" -DestinationPath "$relDir/PrintGo-Command-Center-Windows-x64-Portable.zip" -Force

          # 4. Agent Portable ZIP (contains Agent + SumatraPDF + Notices ONLY)
          $agentStage = "agent-only-stage"
          New-Item -ItemType Directory -Force -Path $agentStage
          Copy-Item "installer/stage/PrintGo-Agent.exe" -Destination "$agentStage/" -Force
          Copy-Item "installer/stage/SumatraPDF.exe" -Destination "$agentStage/" -Force
          Copy-Item "installer/stage/THIRD_PARTY_NOTICES.txt" -Destination "$agentStage/" -Force
          Compress-Archive -Path "$agentStage/*" -DestinationPath "$relDir/PrintGo-Agent-Windows-x64.zip" -Force
          Remove-Item -Recurse -Force $agentStage

          Write-Host "All 4 release packages assembled:"
          Get-ChildItem $relDir | Format-Table Name, Length

      - name: Verify Package Contents & Assert Distinct Hashes
        shell: pwsh
        run: |
          $relDir = "release-artifacts"

          # Verify Portable ZIP has GUI
          $portableTemp = "verify-portable"
          Expand-Archive -Path "$relDir/PrintGo-Command-Center-Windows-x64-Portable.zip" -DestinationPath $portableTemp -Force
          if (-not (Test-Path "$portableTemp/PrintGo-ControlCenter.exe")) {
            throw "VERIFICATION FAILED: PrintGo-ControlCenter.exe missing from Portable ZIP"
          }
          if (-not (Test-Path "$portableTemp/PrintGo-Agent.exe")) {
            throw "VERIFICATION FAILED: PrintGo-Agent.exe missing from Portable ZIP"
          }
          if (-not (Test-Path "$portableTemp/SumatraPDF.exe")) {
            throw "VERIFICATION FAILED: SumatraPDF.exe missing from Portable ZIP"
          }
          Remove-Item -Recurse -Force $portableTemp

          # Verify Agent ZIP does NOT have GUI
          $agentTemp = "verify-agent"
          Expand-Archive -Path "$relDir/PrintGo-Agent-Windows-x64.zip" -DestinationPath $agentTemp -Force
          if (Test-Path "$agentTemp/PrintGo-ControlCenter.exe") {
            throw "VERIFICATION FAILED: PrintGo-ControlCenter.exe should NOT be in Agent ZIP"
          }
          if (-not (Test-Path "$agentTemp/PrintGo-Agent.exe")) {
            throw "VERIFICATION FAILED: PrintGo-Agent.exe missing from Agent ZIP"
          }
          Remove-Item -Recurse -Force $agentTemp

          # Assert Hashes are NOT equal
          $hPortable = (Get-FileHash -Algorithm SHA256 "$relDir/PrintGo-Command-Center-Windows-x64-Portable.zip").Hash
          $hAgentZip = (Get-FileHash -Algorithm SHA256 "$relDir/PrintGo-Agent-Windows-x64.zip").Hash
          if ($hPortable -eq $hAgentZip) {
            throw "VERIFICATION FAILED: Portable ZIP and Agent ZIP have identical hashes ($hPortable)!"
          }
          Write-Host "VERIFIED: Portable ZIP hash ($hPortable) != Agent ZIP hash ($hAgentZip)"

      - name: Run Windows Smoke Tests (Install, Launch, Single-Instance, Rollback)
        shell: pwsh
        run: |
          $relDir = "release-artifacts"
          $setup = (Resolve-Path "$relDir/PrintGo-Command-Center-Windows-x64-Setup.exe").Path

          # 1. Setup mock credentials in AppData to test preservation
          $appDataPrintGo = "$env:LOCALAPPDATA\PrintGo"
          New-Item -ItemType Directory -Force -Path $appDataPrintGo | Out-Null
          $mockCreds = "$appDataPrintGo\agent-credentials.json"
          Set-Content -Path $mockCreds -Value '{"apiUrl":"https://mock.printgo.dev","token":"mock-dpapi-token"}'

          # 2. Test Silent Installation
          Write-Host "Running silent installation..."
          $installProc = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART" -PassThru -Wait
          if ($installProc.ExitCode -ne 0) {
            throw "Silent installation failed with exit code $($installProc.ExitCode)"
          }

          # 3. Verify Installed Tree
          $installDir = "$env:LOCALAPPDATA\Programs\PrintGo"
          Write-Host "Verifying installed directory: $installDir"
          $expectedFiles = @("PrintGo-ControlCenter.exe", "PrintGo-Agent.exe", "SumatraPDF.exe", "unins000.exe")
          foreach ($f in $expectedFiles) {
            $p = Join-Path $installDir $f
            if (-not (Test-Path $p)) { throw "Expected installed file missing: $p" }
            Write-Host "  Found: $f ($((Get-Item $p).Length) bytes)"
          }

          # 4. Smoke test Agent
          Write-Host "Testing installed Agent --version and --help..."
          & "$installDir\PrintGo-Agent.exe" --version
          & "$installDir\PrintGo-Agent.exe" --help

          # 5. Test GUI launch and Single-Instance enforcement
          Write-Host "Testing GUI launch and single-instance behavior..."
          $guiProc1 = Start-Process -FilePath "$installDir\PrintGo-ControlCenter.exe" -ArgumentList "--minimized" -PassThru
          Start-Sleep -Seconds 3
          if ($guiProc1.HasExited) {
            throw "PrintGo-ControlCenter.exe exited prematurely"
          }
          Write-Host "Instance 1 running (PID: $($guiProc1.Id))"

          # Launch instance 2: must detect instance 1 and exit immediately
          $guiProc2 = Start-Process -FilePath "$installDir\PrintGo-ControlCenter.exe" -ArgumentList "--minimized" -PassThru
          $exited2 = $guiProc2.WaitForExit(5000)
          if (-not $exited2) {
            Stop-Process -Id $guiProc2.Id -Force
            throw "Instance 2 did not exit within 5 seconds (single-instance check failed)"
          }
          Write-Host "Instance 2 exited cleanly within timeout as expected"

          # Stop all GUI and agent processes spawned during the test
          Get-Process -Name "PrintGo-ControlCenter", "PrintGo-Agent", "SumatraPDF" -ErrorAction SilentlyContinue | Stop-Process -Force
          Write-Host "All PrintGo test processes terminated."
          Start-Sleep -Seconds 1

          # 6. Verify config preservation
          if (-not (Test-Path $mockCreds)) {
            throw "Credentials file was deleted by installer!"
          }
          $credContent = Get-Content -Path $mockCreds -Raw
          if ($credContent -notmatch "mock-dpapi-token") {
            throw "Credentials content corrupted!"
          }
          Write-Host "Configuration preservation verified."

          # 7. Test Uninstallation & Rollback
          Write-Host "Testing silent uninstaller..."
          $uninstaller = Join-Path $installDir "unins000.exe"
          $uninstProc = Start-Process -FilePath $uninstaller -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART" -PassThru -Wait
          
          # Wait up to 15s for the child uninstaller in Temp to finish removing files
          $timeout = [DateTime]::UtcNow.AddSeconds(15)
          while ((Test-Path "$installDir\PrintGo-ControlCenter.exe") -and ([DateTime]::UtcNow -lt $timeout)) {
            Start-Sleep -Milliseconds 500
          }
          if (Test-Path "$installDir\PrintGo-ControlCenter.exe") {
            throw "Uninstaller did not remove PrintGo-ControlCenter.exe"
          }
          Write-Host "Uninstaller successfully removed installed binaries."
          # Inno Setup keeps user credentials intact
          if (-not (Test-Path $mockCreds)) {
            throw "Uninstaller deleted user credentials unexpectedly!"
          }
          Write-Host "Silent uninstallation and data preservation smoke tests passed!"
          Remove-Item -Recurse -Force $appDataPrintGo

      - name: Generate Checksums & Update Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd release-artifacts
          shasum -a 256 PrintGo-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            TAG="v2.1.0-phase9"
          fi
          echo "Updating release $TAG with verified assets..."
          
          # Delete outdated assets if present
          gh release delete-asset "$TAG" PrintGo-Windows-Test.zip PrintGo-Command-Center.exe SumatraPDF.exe --yes || true

          # Upload all 4 packages + SHA256SUMS.txt
          gh release upload "$TAG" PrintGo-* SHA256SUMS.txt --clobber


